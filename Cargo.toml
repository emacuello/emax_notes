[package]
name = "emax-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_10"] }
glib = "0.22"
sourceview5 = "0.11"
tempfile = "3"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
directories = "6"
notify = "8"
notify-debouncer-mini = "0.7"
futures-channel = "0.3" # ya en el árbol (transitivo de glib); canal watcher→main loop
futures-core = "0.3" # idem; trait Stream para sondear el canal sin polling
rusqlite = { version = "0.32", features = ["bundled"] } # FTS5 (unicode61, sin porter/trigram); índice descartable en cache XDG
pulldown-cmark = { version = "0.12", features = ["simd"] } # preview sin WebView
